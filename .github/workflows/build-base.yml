name: Build Base Image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"  # каждое воскресенье в 02:00 UTC
  push:
    branches:
      - master
      - feature/optimized-rewrite
    paths:
      - Dockerfile.base
      - scripts/comfy-node-install.sh
      - scripts/comfy-manager-set-mode.sh

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker rmi $(docker images -q) 2>/dev/null || true
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:base-latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.name }}:base-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo.outputs.name }}:base-buildcache,mode=max
