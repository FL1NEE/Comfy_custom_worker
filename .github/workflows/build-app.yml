name: Build App Image

on:
  push:
    branches:
      - master
      - feature/optimized-rewrite
    paths:
      - Dockerfile
      - handler.py
      - src/start.sh
      - src/optimize_pytorch.py
      - requirements.txt
      - custom_nodes/**
      - watermark.png

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            SAFE_BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')
            echo "tag=${SAFE_BRANCH}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.name }}:app-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo.outputs.name }}:app-buildcache,mode=max
